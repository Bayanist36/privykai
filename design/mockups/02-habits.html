<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <title>Сегодня — список привычек</title>
    <link rel="stylesheet" href="../styles/design-system.css" />
    <link rel="stylesheet" href="../styles/screen.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar" data-statusbar></div>

      <main class="body body--scroll body--tabbar">
        <header class="screen-head">
          <p class="screen-head__eyebrow">Пятница, 23 октября</p>
          <h1 class="screen-head__title">Сегодня</h1>
        </header>

        <section class="progress-card" aria-label="Прогресс за сегодня">
          <div class="progress-card__top">
            <div>
              <p class="progress-card__label">Выполнено сегодня</p>
              <p class="progress-card__count">3 <span>из 5</span></p>
            </div>
            <span class="progress-card__percent">60%</span>
          </div>
          <div class="progress-card__track"><i style="width: 60%"></i></div>
          <p class="progress-card__note">Осталось 2 привычки</p>
        </section>

        <div class="section-head">
          <h2 class="section-head__title">Привычки</h2>
          <span class="section-head__meta">3 из 5</span>
        </div>

        <div class="habit-list">
          <article
            class="habit is-done"
            role="button"
            tabindex="0"
            aria-pressed="true"
            aria-label="Вода, выполнено, серия 12 дней подряд"
            style="--habit-soft: #e4efe8; --habit-color: #2a7052"
          >
            <span class="habit__icon" aria-hidden="true">💧</span>
            <div class="habit__text">
              <h3 class="habit__name">Вода</h3>
              <p class="habit__meta">
                <svg class="icon"><use href="#i-flame" /></svg>
                12 дней подряд
              </p>
            </div>
            <span class="habit__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </article>

          <article
            class="habit is-done"
            role="button"
            tabindex="0"
            aria-pressed="true"
            aria-label="Зарядка 10 минут, выполнено, серия 4 дня подряд"
            style="--habit-soft: #f7e4df; --habit-color: #b45a4a"
          >
            <span class="habit__icon" aria-hidden="true">🏃</span>
            <div class="habit__text">
              <h3 class="habit__name">Зарядка 10 минут</h3>
              <p class="habit__meta">
                <svg class="icon"><use href="#i-flame" /></svg>
                4 дня подряд
              </p>
            </div>
            <span class="habit__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </article>

          <article
            class="habit"
            role="button"
            tabindex="0"
            aria-pressed="false"
            aria-label="Чтение, не выполнено, серия 21 день подряд"
            style="--habit-soft: #e6eef6; --habit-color: #3c6e9f"
          >
            <span class="habit__icon" aria-hidden="true">📖</span>
            <div class="habit__text">
              <h3 class="habit__name">Чтение</h3>
              <p class="habit__meta">
                <svg class="icon"><use href="#i-flame" /></svg>
                21 день подряд
              </p>
            </div>
            <span class="habit__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </article>

          <article
            class="habit is-done"
            role="button"
            tabindex="0"
            aria-pressed="true"
            aria-label="Медитация, выполнено, серия 7 дней подряд"
            style="--habit-soft: #ece8f4; --habit-color: #6b5b95"
          >
            <span class="habit__icon" aria-hidden="true">🧘</span>
            <div class="habit__text">
              <h3 class="habit__name">Медитация</h3>
              <p class="habit__meta">
                <svg class="icon"><use href="#i-flame" /></svg>
                7 дней подряд
              </p>
            </div>
            <span class="habit__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </article>

          <article
            class="habit"
            role="button"
            tabindex="0"
            aria-pressed="false"
            aria-label="Прогулка на свежем воздухе, не выполнено"
            style="--habit-soft: #e1f0ee; --habit-color: #2f7c77"
          >
            <span class="habit__icon" aria-hidden="true">🚶</span>
            <div class="habit__text">
              <h3 class="habit__name">Прогулка на свежем воздухе</h3>
              <p class="habit__meta habit__meta--muted">
                <svg class="icon"><use href="#i-flame" /></svg>
                Серия начнётся сегодня
              </p>
            </div>
            <span class="habit__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </article>
        </div>
      </main>

      <button class="fab" aria-label="Добавить привычку">
        <svg class="icon"><use href="#i-plus" /></svg>
      </button>

      <nav class="tabbar" aria-label="Основная навигация">
        <a class="tab is-active" href="#">
          <svg class="icon"><use href="#i-today" /></svg>
          <span>Сегодня</span>
        </a>
        <a class="tab" href="#">
          <svg class="icon"><use href="#i-chart" /></svg>
          <span>Статистика</span>
        </a>
        <a class="tab" href="#">
          <svg class="icon"><use href="#i-settings" /></svg>
          <span>Настройки</span>
        </a>
      </nav>
    </div>
    <script src="../styles/ui.js"></script>
  </body>
</html>
