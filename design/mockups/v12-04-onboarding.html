<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <title>v1.2 — первый запуск</title>
    <link rel="stylesheet" href="../styles/design-system.css" />
    <link rel="stylesheet" href="../styles/screen.css" />
    <link rel="stylesheet" href="../styles/v12.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar" data-statusbar></div>

      <main class="onboarding">
        <div class="onb-step">
          <span class="onb-step__label">Шаг 2 из 2</span>
          <span class="onb-progress" aria-hidden="true"><i class="is-active"></i><i class="is-active"></i></span>
          <button class="skip">Пропустить</button>
        </div>

        <h1 class="onb-title">С чего начнём?</h1>
        <p class="onb-text">
          Выберите первую привычку. Название, иконку и дни можно изменить в любой
          момент.
        </p>

        <div class="onb-options" role="radiogroup" aria-label="Первая привычка">
          <button class="onb-option is-selected" role="radio" aria-checked="true" style="--habit-soft: #e4efe8">
            <span class="onb-option__icon" aria-hidden="true">💧</span>
            <span class="onb-option__text">
              <span class="onb-option__name">Пить воду</span>
              <span class="onb-option__meta">Каждый день · напоминание в 08:00</span>
            </span>
            <span class="onb-option__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </button>

          <button class="onb-option" role="radio" aria-checked="false" style="--habit-soft: #e6eef6">
            <span class="onb-option__icon" aria-hidden="true">📖</span>
            <span class="onb-option__text">
              <span class="onb-option__name">Читать 20 минут</span>
              <span class="onb-option__meta">Каждый день · напоминание в 20:00</span>
            </span>
            <span class="onb-option__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </button>

          <button class="onb-option" role="radio" aria-checked="false" style="--habit-soft: #e1f0ee">
            <span class="onb-option__icon" aria-hidden="true">🚶</span>
            <span class="onb-option__text">
              <span class="onb-option__name">Гулять 10 000 шагов</span>
              <span class="onb-option__meta">Каждый день · без напоминания</span>
            </span>
            <span class="onb-option__check" aria-hidden="true">
              <svg class="icon"><use href="#i-check" /></svg>
            </span>
          </button>

          <button class="onb-option onb-option--custom">
            <span class="onb-option__icon" aria-hidden="true">
              <svg class="icon"><use href="#i-plus" /></svg>
            </span>
            <span class="onb-option__text">
              <span class="onb-option__name">Своя привычка</span>
              <span class="onb-option__meta">Пустая форма</span>
            </span>
            <svg class="icon" style="color: var(--text-tertiary)"><use href="#i-chevron-right" /></svg>
          </button>
        </div>

        <div class="onb-footer">
          <button class="btn btn--primary btn--block">Добавить «Пить воду»</button>
          <button class="onb-later">Позже</button>
          <p class="onb-privacy">
            <svg class="icon"><use href="#i-shield" /></svg>
            Данные остаются на телефоне
          </p>
        </div>
      </main>
    </div>

    <script src="../styles/ui.js"></script>
  </body>
</html>
