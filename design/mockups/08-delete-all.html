<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=360, initial-scale=1" />
    <title>Удаление всех данных</title>
    <link rel="stylesheet" href="../styles/design-system.css" />
    <link rel="stylesheet" href="../styles/screen.css" />
  </head>
  <body>
    <div class="phone">
      <div class="statusbar" data-statusbar></div>

      <main class="body body--tabbar">
        <header class="screen-head">
          <h1 class="screen-head__title">Настройки</h1>
        </header>

        <div class="privacy-banner" style="margin-top: 16px">
          <svg class="icon"><use href="#i-shield" /></svg>
          <span>Данные хранятся только на этом устройстве</span>
        </div>

        <p class="group-label">Напоминания</p>
        <div class="group">
          <div class="setting-row">
            <span class="setting-row__icon"><svg class="icon"><use href="#i-bell" /></svg></span>
            <div class="setting-row__text">
              <p class="setting-row__title">Напоминания</p>
              <p class="setting-row__sub">По расписанию каждой привычки</p>
            </div>
            <span class="switch is-on" role="switch" aria-checked="true"></span>
          </div>
        </div>

        <p class="group-label">Данные</p>
        <div class="group">
          <div class="setting-row setting-row--danger">
            <span class="setting-row__icon"><svg class="icon"><use href="#i-trash" /></svg></span>
            <div class="setting-row__text">
              <p class="setting-row__title">Сбросить все данные</p>
              <p class="setting-row__sub">Привычки и история исчезнут с телефона</p>
            </div>
          </div>
        </div>
      </main>

      <div class="screen-dim"></div>
      <div class="dialog-wrap">
        <div class="dialog" role="alertdialog" aria-modal="true" aria-labelledby="del-title">
          <h2 class="dialog__title" id="del-title">Сбросить все данные?</h2>
          <p class="dialog__body">
            Все привычки, серии и статистика удалятся с телефона без возможности восстановления.
          </p>
          <div class="dialog__actions">
            <button class="btn btn--secondary">Отмена</button>
            <button class="btn btn--destructive">Продолжить</button>
          </div>
        </div>
      </div>
    </div>
    <script src="../styles/ui.js"></script>
  </body>
</html>
